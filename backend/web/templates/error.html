{{define "error"}}{{template "header" .}}
<p class="status failed" role="alert">{{.Message}}</p>
<dl class="meta">
  <dt>Error code</dt><dd><code>{{.Code}}</code></dd>
  {{with .RequestID}}<dt>Request ID</dt><dd><code>{{.}}</code></dd>{{end}}
</dl>
<p><a href="/">Go to the start page</a></p>
{{template "footer" .}}{{end}}
